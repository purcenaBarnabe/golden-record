name: Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Enable pinned Yarn version
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check types
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test

      - name: Build static site
        run: yarn build

      - name: Check deployment files
        run: |
          test -f dist/client/index.html
          test -f dist/client/_headers

      - name: Save production site
        if: github.repository == 'purcenaBarnabe/golden-record' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-pages
          path: dist/client/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy production
    needs: build
    if: github.repository == 'purcenaBarnabe/golden-record' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://voyager-golden-record.pages.dev
    steps:
      # A fresh runner receives only the static site, with no application checkout.
      - name: Download static site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudflare-pages
          path: site

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      # Keep this version aligned with the exact devDependency in package.json.
      - name: Install Wrangler without deployment credentials
        run: npm install --global wrangler@4.164.0

      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the production environment. See README.md.' >&2
            exit 1
          fi
          wrangler pages deploy site \
            --project-name voyager-golden-record \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Deploy $GITHUB_SHA"
